name: Installation statistics

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installation-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch aggregate statistics
        run: node github-report.mjs
        env:
          TELEMETRY_SUMMARY_URL: ${{ vars.TELEMETRY_SUMMARY_URL }}
          TELEMETRY_REPORT_TOKEN: ${{ secrets.TELEMETRY_REPORT_TOKEN }}
      - name: Save daily report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md summary.json
          git diff --cached --quiet || git commit -m 'Update installation statistics'
          git push
